version: 2

models:
  - name: int_order_items
    description: >
      Joins order_items with orders to create a denormalized record
      containing both item-level and header-level attributes.
      Grain: one row per order line item.
    columns:
      - name: order_item_id
        description: "Natural key - unique order line identifier"
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: employee_id
        tests:
          - not_null

  - name: int_order_items_enriched
    description: >
      Enriches int_order_items with product attributes and calculated
      business metrics: line_amount, total_margin, margin_pct.
      Grain: one row per order line item.
    columns:
      - name: order_item_id
        tests:
          - unique
          - not_null
      - name: line_amount
        description: "quantity * item_selling_price"
        tests:
          - not_null
      - name: total_margin
        description: "(selling_price - cost_price) * quantity"
        tests:
          - not_null
